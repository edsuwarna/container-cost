services:
  container-cost-agent:
    image: ghcr.io/edsuwarna/container-cost:latest
    container_name: container-cost-agent
    restart: unless-stopped
    command: >
      --mode=agent
      --server=http://YOUR_CENTRAL_IP:8083
      --api-key=YOUR_API_KEY
      --push-interval=60
    volumes:
      # Docker socket — REQUIRED: to collect container stats
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # NOTE: No config.json needed! VPS config (price, specs, weights)
      # is managed from the central UI — edit on the VPS detail page.
    environment:
      - TZ=Asia/Jakarta
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
